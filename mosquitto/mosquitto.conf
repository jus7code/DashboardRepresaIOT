persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/data/passwd

# MQTT nativo (dispositivos de campo, gateway real, ESP32)
listener 1883
protocol mqtt

# MQTT sobre WebSockets (publicado como wss://<dominio>/mqtt por Caddy)
listener 9001
protocol websockets
